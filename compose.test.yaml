# ชุดทดสอบทั้งหมด — ทั้ง `make test` และ CI เรียกไฟล์นี้ไฟล์เดียวกัน
name: repolens-test

x-data-env: &data-env
  DATABASE_URL: postgres://repolens:repolens@postgres:5432/repolens
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repolens']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # เก็บทุกอย่างในหน่วยความจำเท่านั้น ไม่เขียนลงดิสก์
    # เพราะกุญแจของสมาชิกอยู่ใน Redis และเราสัญญาไว้ว่ามันจะไม่ลงดิสก์ (ADR 0002)
    # ผลข้างเคียงคืองานที่ยังค้างคิวอยู่จะหายเมื่อ Redis ถูกรีสตาร์ต ซึ่งสั่งวิเคราะห์ใหม่ได้
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      target: test
    environment:
      <<: *data-env
      CI: 'true'
      ALLOW_LOCAL_REPOS: '1'
      SESSION_SECRET: repolens-test-secret-ยาวพอสำหรับการทดสอบ
      # ชุดทดสอบตั้งใจไม่ให้ออกอินเทอร์เน็ต การตรวจกุญแจกับ Anthropic จึงมีเทสต์ของตัวเองแยกไว้
      VERIFY_API_KEYS: '0'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # เตรียม repo ตัวอย่างให้เป็น git จริง เพื่อให้ worker โคลนได้เหมือนของผู้ใช้
  fixture:
    build:
      context: .
      target: test
    command:
      - sh
      - -c
      - |
        rm -rf /fixtures/demo && mkdir -p /fixtures/demo
        cp -r /app/tests/fixtures/demo/. /fixtures/demo/
        cd /fixtures/demo
        git init -q -b main
        git config user.email fixture@repolens.test
        git config user.name fixture
        git add -A
        git commit -qm "ตัวอย่างสำหรับทดสอบ"
        chmod -R a+rX /fixtures
        chown -R 1000:1000 /fixtures
    volumes:
      - fixtures:/fixtures

  api:
    build:
      context: .
      target: api
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-test}
        GIT_SHA: ${GIT_SHA:-test}
    environment:
      <<: *data-env
      ALLOW_LOCAL_REPOS: '1'
      SESSION_SECRET: repolens-test-secret-ยาวพอสำหรับการทดสอบ
      VERIFY_API_KEYS: '0'
      # อิมเมจนี้เป็นตัวเดียวกับที่ขึ้นเซิร์ฟเวอร์จริง จึงตั้ง NODE_ENV=production มาในตัว
      # แต่ e2e ยิงผ่าน http ในเครือข่ายของ compose ถ้าคุกกี้ติดแฟล็ก Secure เบราว์เซอร์จะทิ้งทันที
      COOKIE_SECURE: '0'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-test}
    environment:
      <<: *data-env
      ALLOW_LOCAL_REPOS: '1'
      SESSION_SECRET: repolens-test-secret-ยาวพอสำหรับการทดสอบ
    volumes:
      - fixtures:/fixtures:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      fixture: { condition: service_completed_successfully }

  web:
    build:
      context: .
      target: web
    environment:
      API_ORIGIN: http://api:3001
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  e2e:
    build:
      context: .
      target: e2e
    environment:
      E2E_BASE_URL: http://web:3000
    depends_on:
      web: { condition: service_healthy }
      worker: { condition: service_started }

volumes:
  fixtures:
