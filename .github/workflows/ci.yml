name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ทดสอบใน Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # คำสั่งเดียวกับที่นักพัฒนารันในเครื่อง จะได้ไม่มี "เครื่องผมผ่านแต่ CI ไม่ผ่าน"
      - name: prettier + typecheck + unit + integration + ตรวจบันทึกรุ่น
        run: |
          docker compose -f compose.test.yaml build test
          docker compose -f compose.test.yaml run --rm test

      - name: ทดสอบด้วยเบราว์เซอร์จริง
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from e2e e2e

      - name: เก็บ log เมื่อไม่ผ่าน
        if: failure()
        run: docker compose -f compose.test.yaml logs --no-color

      - name: ปิดทุกอย่าง
        if: always()
        run: docker compose -f compose.test.yaml down -v

  publish:
    name: สร้างอิมเมจขึ้น registry
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ตั้งค่าเวอร์ชันจากแท็ก
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          tags: |
            ${{ steps.meta.outputs.repo }}-worker:${{ github.ref_name }}
            ${{ steps.meta.outputs.repo }}-worker:latest

      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          tags: |
            ${{ steps.meta.outputs.repo }}-api:${{ github.ref_name }}
            ${{ steps.meta.outputs.repo }}-api:latest

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          tags: |
            ${{ steps.meta.outputs.repo }}-web:${{ github.ref_name }}
            ${{ steps.meta.outputs.repo }}-web:latest
