# สิ่งที่รันจริงบนเซิร์ฟเวอร์ — ดึงอิมเมจที่ CI สร้างไว้ ไม่ build บนเครื่องปลายทาง
name: repolens

x-data-env: &data-env
  DATABASE_URL: postgres://repolens:${POSTGRES_PASSWORD}@postgres:5432/repolens
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: repolens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repolens']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # เก็บทุกอย่างในหน่วยความจำเท่านั้น ไม่เขียนลงดิสก์
    # เพราะกุญแจของสมาชิกอยู่ใน Redis และเราสัญญาไว้ว่ามันจะไม่ลงดิสก์ (ADR 0002)
    # ผลข้างเคียงคืองานที่ยังค้างคิวอยู่จะหายเมื่อ Redis ถูกรีสตาร์ต ซึ่งสั่งวิเคราะห์ใหม่ได้
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE_REPO:-ghcr.io/benyapol/repolens}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *data-env
      NODE_ENV: production
      LOG_LEVEL: info
      SESSION_SECRET: ${SESSION_SECRET:?ต้องตั้ง SESSION_SECRET ก่อนเปิดบริการ}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${IMAGE_REPO:-ghcr.io/benyapol/repolens}-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *data-env
      NODE_ENV: production
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      MAX_FILES: ${MAX_FILES:-50000}
      SESSION_SECRET: ${SESSION_SECRET:?ต้องตั้ง SESSION_SECRET ก่อนเปิดบริการ}
      COMPREHENSION_CONCURRENCY: ${COMPREHENSION_CONCURRENCY:-1}
      COMPREHEND_MAX_FILES: ${COMPREHEND_MAX_FILES:-400}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: ${IMAGE_REPO:-ghcr.io/benyapol/repolens}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:3001
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-repo.benyapol.com}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
  caddy-data:
  caddy-config:
