# สภาพแวดล้อมสำหรับพัฒนา — ใช้ผ่าน `make dev` เท่านั้น ไม่มีการรันบนเครื่องตัวเอง
name: repolens-dev

x-data-env: &data-env
  DATABASE_URL: postgres://repolens:repolens@postgres:5432/repolens
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repolens']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: source
    command: sh -c "pnpm --filter @repolens/api dev"
    environment:
      <<: *data-env
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      GIT_SHA: ${GIT_SHA:-dev}
      CHANGELOG_DIR: /app/docs/changelog
      LOG_LEVEL: debug
      PORT: 3001
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./docs:/app/docs
      - ./scripts:/app/scripts
    ports:
      - '3001:3001'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      target: source
    command: sh -c "pnpm --filter @repolens/worker dev"
    environment:
      <<: *data-env
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      WORKER_CONCURRENCY: 2
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      target: source
    command: sh -c "pnpm --filter @repolens/web dev"
    environment:
      API_ORIGIN: http://api:3001
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    ports:
      - '3000:3000'
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
